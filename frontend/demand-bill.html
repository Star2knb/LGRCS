<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harmonised Demand Bill</title>
<style>
  :root {
    --green: #0B3D2E; --green-dk: #06281D; --line: #0F1F19; --paper: #FFFFFF; --ink-60: #52635C;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #E7EBE9; margin: 0; padding: 24px; color: #111;
  }
  .toolbar {
    max-width: 820px; margin: 0 auto 14px; display: flex; gap: 10px; justify-content: flex-end;
  }
  .toolbar button {
    font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--green); background: var(--green); color: #fff;
  }
  .toolbar button.ghost { background: #fff; color: var(--green); }
  .sheet {
    max-width: 820px; margin: 0 auto; background: var(--paper); padding: 34px 38px;
    box-shadow: 0 4px 24px rgba(0,0,0,.12); font-size: 13px; line-height: 1.45;
  }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .crest {
    width: 52px; height: 52px; border-radius: 50%; background: var(--green); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .head h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: .02em; color: var(--green-dk); }
  .head .sub { font-size: 12px; color: var(--ink-60); }
  .qr {
    width: 52px; height: 52px; background:
      repeating-conic-gradient(#111 0% 25%, #fff 0% 50%) 0 0/10px 10px; flex-shrink: 0;
    border: 1px solid #ccc;
  }
  hr { border: none; border-top: 2px solid var(--green); margin: 14px 0; }
  .grid2 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 18px; margin-bottom: 10px; }
  .grid2 div div { margin-bottom: 2px; }
  .grid2 b { display: block; }
  .notice-text { margin: 14px 0; font-size: 12.5px; }
  .notice-text b { color: var(--green-dk); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  th, td { border: 1px solid #223; padding: 6px 8px; text-align: left; vertical-align: top; }
  thead th { background: var(--green); color: #fff; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tfoot td { font-weight: 700; background: #F0F4F2; }
  .warn { margin-top: 14px; font-size: 11.5px; font-weight: 600; }
  .warn.small { font-weight: 400; }
  .copies { display: flex; gap: 24px; margin-top: 22px; border-top: 1px dashed #888; padding-top: 16px; }
  .copy { flex: 1; font-size: 11.5px; }
  .copy h3 { font-size: 12px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; color: var(--green-dk); }
  .copy .kv { margin: 3px 0; }
  .sig { margin-top: 26px; border-top: 1px solid #333; padding-top: 4px; width: 70%; }
  .lost { text-align: center; margin-top: 18px; font-size: 11.5px; font-weight: 700; }
  .err { text-align: center; padding: 60px 20px; color: #A32E2E; font-size: 15px; }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .sheet { box-shadow: none; max-width: none; }
  }
</style>
</head>
<body>

<div class="toolbar" id="ownToolbar">
  <button class="ghost" onclick="window.close()">Close</button>
  <button onclick="window.print()">Print</button>
</div>

<div class="sheet" id="sheet">
  <div class="err">Loading demand bill…</div>
</div>

<script>
  if (window.self !== window.top) document.getElementById('ownToolbar').style.display = 'none';
</script>

<script>
const money = n => '₦' + Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function lineRef(billId, idx, code) {
  const digits = String(code || '').replace(/\D/g, '').padEnd(6, '0').slice(-6);
  return `SB-${String(billId).padStart(4, '0')}${String(idx).padStart(2, '0')}${digits}260${String(billId).padStart(4, '0')}`;
}

async function render() {
  const params = new URLSearchParams(location.search);
  const ref = params.get('bill');
  const sheet = document.getElementById('sheet');
  if (!ref) { sheet.innerHTML = '<div class="err">No bill reference given.</div>'; return; }

  let bill;
  try {
    const r = await fetch('/api/bills/' + encodeURIComponent(ref));
    bill = await r.json();
    if (!r.ok) throw new Error(bill.error || 'Bill not found');
  } catch (e) {
    sheet.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }

  const year = new Date(bill.issued_at.replace(' ', 'T')).getFullYear();
  const rows = bill.lines.map((l, i) => `
    <tr>
      <td>${year}</td>
      <td class="num">${lineRef(bill.bill_id, i + 1, l.harmonised_code)}</td>
      <td>${esc(l.item_name)}</td>
      <td class="num">${money(0)}</td>
      <td class="num">${money(l.line_amount)}</td>
      <td class="num">${money(0)}</td>
      <td class="num">${money(l.line_amount)}</td>
    </tr>`).join('');

  const arrearsRow = bill.prior_arrears > 0 ? `
    <tr>
      <td>${year}</td>
      <td class="num">—</td>
      <td>Arrears — Prior Outstanding Bills</td>
      <td class="num">${money(bill.prior_arrears)}</td>
      <td class="num">${money(0)}</td>
      <td class="num">${money(0)}</td>
      <td class="num">${money(bill.prior_arrears)}</td>
    </tr>` : '';

  const totalDue = bill.balance + (bill.prior_arrears || 0);

  sheet.innerHTML = `
    <div class="head">
      <div class="crest">KAC</div>
      <div style="flex:1;text-align:center">
        <h1>KUJE AREA COUNCIL</h1>
        <div class="sub">Kuje Area Council Abuja, FCT &middot; Phone: 08035730391 &middot; Email: kujefct@gmail.com</div>
      </div>
      <div class="qr" title="Verification code"></div>
    </div>
    <hr>
    <div class="grid2">
      <div>
        <div><b>Notice is hereby given to:</b></div>
        <div>${esc(bill.full_name)} (${esc(bill.payer_ref)})</div>
        <div style="margin-top:6px"><b>Property Address:</b></div>
        <div>${esc(bill.address || '—')}${bill.ward_name ? ', ' + esc(bill.ward_name) : ''}</div>
      </div>
      <div>
        <div><b>Account name:</b> Kuje Area Council</div>
        <div><b>Revenue Account:</b> 2031862507</div>
        <div><b>Bank:</b> First Bank, Kuje Branch</div>
      </div>
      <div>
        <div><b>IMPORTANT!</b></div>
        <div>All enquiries are to be forwarded to:</div>
        <div>Council Treasurer &ndash; 07064683372, 08050791026</div>
      </div>
    </div>
    <div class="notice-text">
      The <b>KUJE AREA COUNCIL</b> under the Local Government law demands payment of
      <b>DEMAND NOTICE FOR YEAR ${year}</b> on the above property/business in respect of the
      financial year under consideration. The amount due for the current year and arrears
      (if any) of the former rate is now due from you. Payment of the total amount is to be
      made at any of the designated banks not later than <b>7 days</b> from the date of this
      demand notice. If payment is not made within <b>one week</b> of the date of this Demand
      Notice, legal proceedings shall be taken immediately.
    </div>
    <table>
      <thead><tr><th>Year</th><th>Bill Reference</th><th>Summary</th>
        <th class="num">Arrears (₦)</th><th class="num">Debit (₦)</th>
        <th class="num">Credit (₦)</th><th class="num">Balance (₦)</th></tr></thead>
      <tbody>${rows}${arrearsRow}</tbody>
      <tfoot><tr>
        <td colspan="2">Hours of Payment: Monday &ndash; Friday, 8:00 a.m. &ndash; 4:00 p.m.</td>
        <td>Harmonized Bill Reference<br><span style="font-weight:400">${esc(bill.bill_ref)}</span></td>
        <td colspan="3">Total Due</td>
        <td class="num">${money(totalDue)}</td>
      </tr></tfoot>
    </table>
    <div class="warn">PLEASE PAY DIRECTLY TO THE OVERHEAD DESIGNATED BANK AND COLLECT AN
      AUTOMATED REVENUE RECEIPT AT THE POINT OF PAYMENT &mdash; WITHOUT THIS YOUR PAYMENT IS
      NULL AND VOID.</div>
    <div class="warn">COUNCIL'S POS IS AVAILABLE &mdash; PLEASE DO NOT PAY THROUGH ANY
      COMMERCIAL POS/ASSOCIATION.</div>

    <div class="copies">
      <div class="copy">
        <h3>Bank's / Agent's Copy</h3>
        <div>KUJE AREA COUNCIL</div>
        <div>DEMAND NOTICE FOR YEAR ${year}</div>
        <div class="kv"><b>Payer Name:</b> ${esc(bill.full_name)}</div>
        <div class="kv"><b>Payer ID:</b> ${esc(bill.payer_ref)}</div>
        <div class="kv"><b>Address:</b> ${esc(bill.address || '—')}</div>
        <div class="kv"><b>Area Council:</b> Kuje Area Council</div>
        <div class="kv"><b>Total Due:</b> ${money(totalDue)}</div>
        <div class="sig">Chief Revenue Officer</div>
      </div>
      <div class="copy">
        <h3>Local Govt's Copy</h3>
        <div>KUJE AREA COUNCIL</div>
        <div>DEMAND NOTICE FOR YEAR ${year}</div>
        <div class="kv"><b>Payer Name:</b> ${esc(bill.full_name)}</div>
        <div class="kv"><b>Payer ID:</b> ${esc(bill.payer_ref)}</div>
        <div class="kv"><b>Address:</b> ${esc(bill.address || '—')}</div>
        <div class="kv"><b>Area Council:</b> Kuje Area Council</div>
        <div class="kv"><b>Total Due:</b> ${money(totalDue)}</div>
        <div class="sig">Chief Revenue Officer</div>
      </div>
    </div>
    <div style="text-align:center;font-size:11px;color:#555;margin-top:6px">
      All enquiries are to be forwarded to the Chairman &ndash; Revenue Collection and Review Committee
    </div>
    <div class="lost">LOST BILL WILL ATTRACT A FINE OF ₦1,000, FOR REPRINTING</div>
  `;
}
render();
</script>
</body>
</html>
