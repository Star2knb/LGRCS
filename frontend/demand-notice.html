<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harmonised Demand Notice</title>
<style>
  :root { --green: #0B3D2E; --green-dk: #06281D; --brass: #C08B2C; --ink-60: #52635C; }
  * { box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #E7EBE9; margin: 0; padding: 24px; color: #111;
  }
  .toolbar { max-width: 820px; margin: 0 auto 14px; display: flex; gap: 10px; justify-content: flex-end; }
  .toolbar button {
    font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--green); background: var(--green); color: #fff;
  }
  .toolbar button.ghost { background: #fff; color: var(--green); }
  .sheet {
    max-width: 820px; margin: 0 auto; background: #fff; padding: 30px 38px;
    box-shadow: 0 4px 24px rgba(0,0,0,.12); font-size: 13px; line-height: 1.45;
  }
  .head { display: flex; align-items: flex-start; gap: 14px; }
  .crest {
    width: 56px; height: 56px; border-radius: 50%; background: var(--green); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .head .titles { flex: 1; text-align: center; }
  .head h1 { font-size: 20px; margin: 0; color: var(--green); letter-spacing: .02em; }
  .head .fcta { color: #A32E2E; font-weight: 700; font-size: 12px; letter-spacing: .03em; }
  .head .addr { font-size: 11.5px; color: var(--ink-60); margin-top: 2px; }
  .head .dept { font-size: 12px; margin-top: 6px; font-weight: 600; }
  .head .dept small { display: block; font-weight: 400; color: var(--ink-60); }
  .noref { text-align: right; font-size: 12px; flex-shrink: 0; white-space: nowrap; }
  .banner {
    background: #A32E2E; color: #fff; text-align: center; font-weight: 700; letter-spacing: .04em;
    padding: 7px; margin: 12px 0; font-size: 14px;
  }
  .fields div { margin: 4px 0; }
  .fields b { display: inline-block; min-width: 190px; }
  .fields .fill { border-bottom: 1px solid #888; display: inline-block; min-width: 260px; }
  .notice-text { margin: 14px 0; font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  th, td { border: 1px solid #223; padding: 5px 7px; text-align: left; }
  thead th { background: var(--green); color: #fff; font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.sn { text-align: center; width: 34px; }
  tfoot td { font-weight: 700; background: #F0F4F2; }
  .words { margin-top: 14px; }
  .words .fill { border-bottom: 1px solid #888; display: inline-block; min-width: 500px; padding-bottom: 2px; }
  .payline { margin-top: 8px; font-weight: 600; }
  .acct { margin-top: 14px; display: flex; gap: 40px; align-items: flex-start; }
  .acct .kv { margin: 2px 0; }
  .sig { margin-top: 34px; text-align: right; }
  .sig .line { border-top: 1px solid #333; width: 220px; margin-left: auto; padding-top: 4px; }
  .err { text-align: center; padding: 60px 20px; color: #A32E2E; font-size: 15px; }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .sheet { box-shadow: none; max-width: none; }
  }
</style>
</head>
<body>

<div class="toolbar" id="ownToolbar">
  <button class="ghost" onclick="window.close()">Close</button>
  <button onclick="window.print()">Print</button>
</div>

<div class="sheet" id="sheet">
  <div class="err">Loading demand notice…</div>
</div>

<script>
  if (window.self !== window.top) document.getElementById('ownToolbar').style.display = 'none';
</script>

<script>
const money = n => '₦' + Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
  'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
const TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

function threeDigits(n) {
  let s = '';
  if (n >= 100) { s += ONES[Math.floor(n / 100)] + ' Hundred'; n %= 100; if (n) s += ' and '; }
  if (n >= 20) { s += TENS[Math.floor(n / 10)]; if (n % 10) s += '-' + ONES[n % 10].toLowerCase(); }
  else if (n > 0) { s += ONES[n]; }
  return s;
}

function numberToWords(n) {
  n = Math.round(n);
  if (n === 0) return 'Zero';
  const groups = [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand'], [1, '']];
  let s = '';
  for (const [size, label] of groups) {
    if (n >= size) {
      const count = Math.floor(n / size);
      s += (s ? ' ' : '') + threeDigits(count) + (label ? ' ' + label : '');
      n %= size;
    }
  }
  return s.trim();
}

function amountInWords(amount) {
  const naira = Math.floor(amount);
  const kobo = Math.round((amount - naira) * 100);
  let words = numberToWords(naira) + ' Naira';
  if (kobo > 0) words += ', ' + numberToWords(kobo) + ' Kobo';
  return words + ' Only';
}

async function render() {
  const params = new URLSearchParams(location.search);
  const ref = params.get('bill');
  const sheet = document.getElementById('sheet');
  if (!ref) { sheet.innerHTML = '<div class="err">No bill reference given.</div>'; return; }

  let bill;
  try {
    const r = await fetch('/api/bills/' + ref);
    bill = await r.json();
    if (!r.ok) throw new Error(bill.error || 'Bill not found');
  } catch (e) {
    sheet.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }

  const issued = new Date(bill.issued_at.replace(' ', 'T'));
  const year = issued.getFullYear();
  const noticeNo = 2000 + (bill.bill_id % 8000);

  const rows = bill.lines.map((l, i) => `
    <tr>
      <td class="sn">${i + 1}</td>
      <td>${esc(l.item_name)}</td>
      <td class="num">${esc(l.harmonised_code)}</td>
      <td class="num">${money(0)}</td>
      <td class="num">${money(l.line_amount)}</td>
      <td class="num">${money(l.line_amount)}</td>
    </tr>`).join('');

  const arrearsRow = bill.prior_arrears > 0 ? `
    <tr>
      <td class="sn">${bill.lines.length + 1}</td>
      <td>Arrears — Prior Outstanding Bills</td>
      <td class="num">—</td>
      <td class="num">${money(bill.prior_arrears)}</td>
      <td class="num">${money(0)}</td>
      <td class="num">${money(bill.prior_arrears)}</td>
    </tr>` : '';

  const grandTotal = bill.balance + (bill.prior_arrears || 0);

  sheet.innerHTML = `
    <div class="head">
      <div class="crest">KAC</div>
      <div class="titles">
        <h1>KUJE AREA COUNCIL</h1>
        <div class="fcta">FEDERAL CAPITAL TERRITORY ADMINISTRATION</div>
        <div class="addr">Secretariat Complex, Kuje-Abuja &middot; Tel: 08035730391, 08050791026</div>
        <div class="dept">FINANCE DEPARTMENT<small>(Revenue Division)</small></div>
      </div>
      <div class="noref">No: ${noticeNo}</div>
    </div>
    <div class="banner">HARMONISED DEMAND NOTICE</div>
    <div class="fields">
      <div><b>Our Ref:</b> <span class="fill">KAC/FS/RD/1/VOL.${String(bill.bill_id).padStart(4, '0')}</span></div>
      <div><b>Demand Notice:</b> <span class="fill">${esc(bill.bill_ref)}</span></div>
      <div><b>Type of Business:</b> <span class="fill">${esc(bill.full_name)} (${esc(bill.payer_ref)})</span></div>
      <div><b>Location / Address:</b> <span class="fill">${esc(bill.address || '—')}${bill.ward_name ? ', ' + esc(bill.ward_name) : ''}</span></div>
      <div><b>Date of Demand Notice:</b> <span class="fill">${issued.toLocaleDateString('en-NG', { day: 'numeric', month: 'long', year: 'numeric' })}</span></div>
    </div>
    <div class="notice-text">
      The Management of Kuje Area Council wishes to notify you of your bill of the year:
      <b>${year}</b>. This is pursuant to the provision of the Kuje Area Council bye-law and the
      provision of section 7, fourth schedule of the 1999 Constitution of the Federal Republic of
      Nigeria as amended, and other relevant laws on the list of Taxes and Levies collected by the
      Local Government with regards to the operation of business within the Area Council.
    </div>
    <table>
      <thead><tr><th>S/No</th><th>Items</th><th class="num">Payment Code</th>
        <th class="num">Arrears if any</th><th class="num">Current Bill</th><th class="num">Total</th></tr></thead>
      <tbody>${rows}${arrearsRow}</tbody>
      <tfoot><tr><td colspan="5">Grand Total</td><td class="num">${money(grandTotal)}</td></tr></tfoot>
    </table>
    <div class="words">Amount in words: <span class="fill">${esc(amountInWords(grandTotal))}</span></div>
    <div class="payline">Payable to Kuje Area Council Account within 14 days of this notice.</div>
    <div class="acct">
      <div>
        <div class="kv"><b>Account Details</b></div>
        <div class="kv">Account Name: Kuje Area Council Revenue Account</div>
        <div class="kv">Account No: 2031862507</div>
        <div class="kv">First Bank, Kuje Branch</div>
      </div>
    </div>
    <div class="sig"><div class="line">Chief Revenue Officer</div></div>
  `;
}
render();
</script>
</body>
</html>
